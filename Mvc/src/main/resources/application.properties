# Banco simulado: H2 em memoria (some ao parar a aplicacao)
spring.datasource.url=jdbc:h2:mem:demo
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Console web do H2 para mostrar as tabelas: http://localhost:8082/h2-console
spring.h2.console.enabled=true

# Dados de exemplo ao iniciar (use false para comecar com o banco vazio)
demo.dados-iniciais=true

# Mostra no console o SQL gerado: ele aparece vindo do Model
spring.jpa.show-sql=true

# Recarrega os templates sem reiniciar
spring.thymeleaf.cache=false

server.port=8081
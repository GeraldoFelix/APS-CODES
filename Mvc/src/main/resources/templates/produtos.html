<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produtos</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        .ok { color: #0a7a2f; }
        .erro { color: #b00020; }
        input { margin-right: .5rem; }
    </style>
</head>
<body>
<!-- VIEW: só apresenta os dados que o Controller entrega. Sem regra de negócio. -->
<h1>Produtos</h1>
<p><a href="/usuarios">Ir para Usuários</a></p>

<p class="ok" th:if="${sucesso}" th:text="${sucesso}"></p>
<p class="erro" th:if="${erro}" th:text="${erro}"></p>

<h2>Cadastrar</h2>
<form th:action="@{/produtos}" method="post">
    Nome: <input name="nome" required>
    Preço: <input name="preco" required>
    Id do usuário: <input name="idUsuario" required>
    <button>Cadastrar</button>
</form>

<h2>Buscar por Id</h2>
<form th:action="@{/produtos/buscar}" method="get">
    Id: <input name="id" required>
    <button>Buscar</button>
</form>

<h2>Lista</h2>
<table border="1" cellpadding="6">
    <tr><th>Id</th><th>Nome</th><th>Preço</th><th>Usuário</th><th></th></tr>
    <tr th:each="p : ${produtos}">
        <td th:text="${p.id}"></td>
        <td th:text="${p.nome}"></td>
        <td th:text="'R$ ' + ${p.preco}"></td>
        <td th:text="${p.idUsuario}"></td>
        <td><a th:href="@{/produtos/{id}(id=${p.id})}">Detalhes</a></td>
    </tr>
</table>
</body>
</html>
